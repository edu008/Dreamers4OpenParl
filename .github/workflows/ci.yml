name: CI

on:
  # Branches laufen über ihren Pull Request, main nach dem Merge; so läuft nichts doppelt.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein neuer Push bricht den älteren Lauf desselben PRs ab; auf main läuft jeder Lauf zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Lint und Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parltopics
          POSTGRES_PASSWORD: parltopics
          POSTGRES_DB: parltopics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parltopics -d parltopics"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://parltopics:parltopics@localhost:5432/parltopics
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run parltopics registry validate

  web:
    name: Web-App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: node ../scripts/check-web-dist.mjs dist

  diagrams:
    name: Diagramme aktuell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/diagrams.mjs check
        env:
          ARCHIFY_UPDATE_CHECK_DISABLED: "1"

  offline:
    name: Air-Gap-Bundle und Offline-Test
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Offline-Test (Image aus Wheels und web/dist, internes Docker-Netz)
        run: make offline-test
      # Das 1.4-GB-Bundle nur auf main bauen; im PR reicht der Offline-Test.
      - name: Bundle bauen
        if: github.ref == 'refs/heads/main'
        run: make bundle
      - name: Bundle einspielen
        if: github.ref == 'refs/heads/main'
        run: |
          tar -C "$RUNNER_TEMP" -xf dist/parltopics-bundle-*.tar
          cd "$RUNNER_TEMP"/parltopics-bundle-*/
          ./load-bundle.sh "$RUNNER_TEMP/parltopics-base"
          test -f "$RUNNER_TEMP/parltopics-base/registry/tags.yaml"
          test -f web/dist/index.html
          grep -q "^PARLTOPICS_VERSION=$(cat VERSION)$" "$RUNNER_TEMP/parltopics-base/.env"
          grep -q "^REGISTRY_DIR=$RUNNER_TEMP/parltopics-base/registry$" "$RUNNER_TEMP/parltopics-base/.env"
