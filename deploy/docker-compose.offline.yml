# Offline-Test (PRD F22, AIRGAP.md 4): alle Dienste in einem Docker-Netz ohne Route nach aussen,
# der LLM-Endpunkt ist ein Mock. Aufruf über deploy/airgap/offline-test.sh.
networks:
  airgap:
    internal: true

services:
  db:
    networks: [airgap]
    ports: !reset []

  api:
    networks: [airgap]
    ports: !reset []
    environment:
      LLM_BASE_URL: http://mock-llm:8080/v1
      LLM_NAME: mock-8b
      LLM_NAME_LARGE: mock-70b
      LLM_API_KEY: offline-test
    depends_on:
      db:
        condition: service_healthy
      mock-llm:
        condition: service_started

  mock-llm:
    image: parltopics-app:${PARLTOPICS_VERSION:-dev}
    command: ["uvicorn", "app:app", "--app-dir", "/mock", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ../tests/mock_llm:/mock:ro
    networks: [airgap]
