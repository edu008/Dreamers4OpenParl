# Beschreibungen und Synonyme für APS-Kapitel und -Themen (Pilotlauf 18.10.2026).
#
# APS liefert nur Namen. Ohne Beschreibung und Synonyme wählte Apertus oft das falsche Kapitel
# (z. B. „Loi sur la chasse“ → Medien). `parltopics registry import-aps` und
# `parltopics registry apply-descriptions` übernehmen diese Datei nach registry/tags.yaml:
# `it`/`en` werden zum italienischen/englischen Namen (APS liefert nur DE und FR), `de` zur
# deutschen Definition (bei Kapiteln bleibt „Umfasst: …“ angehängt),
# `alt` zu den Synonymen (alt_labels), `close_match`/`broad_match` zum Mapping auf die 28
# Curia-Vista-Sachbereiche (curia:<topic_id> aus che_topics_vocabulary.csv). Themen erben das
# Mapping ihres Kapitels; eigene Einträge nur, wo ein Thema anders liegt. Gepflegt von Hand;
# Änderungen erhöhen registry_version (das Mapping ändert den scheme_hash nicht, F27).

