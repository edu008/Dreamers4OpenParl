# Beschreibungen und Synonyme für APS-Kapitel und -Themen (Pilotlauf 18.10.2026).
#
# APS liefert nur Namen. Ohne Beschreibung und Synonyme wählte Apertus oft das falsche Kapitel
# (z. B. „Loi sur la chasse“ → Medien). `parltopics registry import-aps` und
# `parltopics registry apply-descriptions` übernehmen diese Datei nach registry/tags.yaml:
# `de` wird zur deutschen Definition (bei Kapiteln bleibt „Umfasst: …“ angehängt),
# `alt` zu den Synonymen (alt_labels). Gepflegt von Hand; Änderungen erhöhen registry_version.

# Kapitel ------------------------------------------------------------------------------------

aps:1.1:
  de: Grundsätze des Staates und seines Gebiets — Selbstverständnis der Schweiz, Bundesverfassung als Ganzes, Gebiets- und Grenzfragen zwischen Kantonen und Gemeinden.
aps:1.2:
  de: Aufbau und Arbeit der staatlichen Organe — Bundesrat, Verwaltung, Parlamente, Gerichte, Kantone und Gemeinden als Institutionen, Parteien, Verbände und Lobbyismus; auch Wahlen in Ämter und Kommissionen sowie Vereidigungen.
aps:2.1:
  de: Mitwirkung des Volkes — Abstimmungen, Referenden, Volksinitiativen, Stimm- und Wahlrecht, Abstimmungsverfahren, politische Kampagnen und deren Finanzierung.
aps:2.2:
  de: Wahlen von Volksvertretungen und Regierungen auf Bund, Kantonen und Gemeinden — Wahlvorbereitung, Kandidaturen, Resultate.
aps:3.1:
  de: Beziehungen der Schweiz zum Ausland — EU, andere Staaten, UNO und internationale Organisationen, Neutralität, Aussenhandel, Entwicklungszusammenarbeit, humanitäre Hilfe, Auslandschweizer.
aps:4.1:
  de: Lage und Rechte gesellschaftlicher Gruppen — Bevölkerung, Migration, Asyl, Gleichstellung, Familien, Kinder und Jugend, ältere Menschen, LGBTQIA+, Menschen mit Behinderungen, Fahrende.
aps:4.2:
  de: Schulen aller Stufen, Berufsbildung, Hochschulen und Forschung.
aps:4.3:
  de: Kultur und Kulturförderung, Sprachen und Sprachgebiete, Religionsgemeinschaften, Ortsbild- und Denkmalschutz, Urheberrecht.
aps:4.4:
  de: Presse, Radio, Fernsehen, Online-Medien, Medienförderung und Meinungsumfragen. Nicht gemeint sind Geschäfte, die nur in den Medien erwähnt werden.
aps:5.1:
  de: Gesundheitswesen (Spitäler, Ärzte, Pflege, Medikamente, Sucht, Prävention, Pandemien), Sozialhilfe und Sport.
aps:5.2:
  de: Obligatorische und freiwillige Versicherungen gegen soziale Risiken — AHV, IV, Krankenkasse und Krankenkassenprämien, Unfall, Arbeitslosigkeit, Mutterschaft, Erwerbsersatz, Pensionskasse, Säule 3a, Ergänzungsleistungen.
aps:6.1:
  de: Verkehr aller Art (Strasse, Schiene, öffentlicher Verkehr, Velo, Fussverkehr, Luft, Schiff), Post, Telekommunikation und Digitalisierung von Staat und Gesellschaft.
aps:6.2:
  de: Energieversorgung und Energiepolitik — Strom, Stromnetz, Öl und Gas, Wasserkraft, Sonne, Wind, Biomasse, Geothermie, Kernkraft, Energieeffizienz.
aps:6.3:
  de: Raumplanung, Zonen und Bauen, Wohnungsbau, Wohneigentum, Mieten und Bodenrecht.
aps:6.4:
  de: Schutz der Umwelt — Natur und Landschaft, Biodiversität, Boden, Gewässer, Luft, Klima, Lärm, Abfall und Recycling, Naturgefahren.
aps:7.1:
  de: Recht und Justiz — Grundrechte, Strafrecht, Zivilrecht, Völkerrecht, Einbürgerung, Rechtshilfe, Datenschutz.
aps:7.2:
  de: Sicherheit nach aussen und innen — Armee, Rüstung, Zivilschutz, Zivildienst, Polizei, öffentliche Sicherheit und Ordnung, Cybersicherheit, Landesversorgung.
aps:8.1:
  de: Wirtschaftslage und Wirtschaftspolitik — Konjunktur, Regional- und Standortförderung, Unternehmensrecht, Wettbewerb, Konsumentenschutz, Tourismus, Wirtschaftsordnung.
aps:8.2:
  de: Finanzen von Bund, Kantonen und Gemeinden — Budget/Voranschlag, Rechnung, Sparprogramme, Schulden, Steuern, Finanzausgleich.
aps:8.3:
  de: Geld- und Finanzmarkt — Geldpolitik, Nationalbank, Banken, Börsen, private Versicherungen, Finanzmarktaufsicht.
aps:8.4:
  de: Landwirtschaft und Ernährung sowie Tiere und Wald — Agrarpolitik, Lebensmittel, Pflanzen- und Tierproduktion, Tierschutz, Jagd und Fischerei, Wolf und Grossraubtiere, Forstwirtschaft, Gentechnik.
aps:8.5:
  de: Arbeitswelt — Arbeitsrecht, Arbeitsmarkt, Löhne, Gesamtarbeitsverträge und Sozialpartner, Arbeitszeit, Schutz der Arbeitnehmenden.

